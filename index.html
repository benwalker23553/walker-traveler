<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B3A5C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<style>body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Walker Digital Traveler</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one sticky tool bar, then a two-column station board (work on the left, parts movement on the right) that stacks on narrow screens. */
:root {
  --bg: #E7EBF0; --panel: #FFFFFF; --panel2: #F1F4F7; --ink: #13202D; --ink2: #4A6580; --line: #C3CDD8;
  --navy: #1B3A5C; --navy2: #24507E; --on-navy: #FFFFFF;
  --ok: #006600; --ok-bg: #E3F1E3; --bad: #B80000; --bad-bg: #FBE4E4; --warn: #8F5200; --warn-bg: #FBEFD9; --info: #1B3A5C; --info-bg: #E1EAF3;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1620; --panel: #17222E; --panel2: #1F2D3B; --ink: #E7EEF5; --ink2: #9DB3C8; --line: #33475C;
    --navy: #2F6298; --navy2: #3A75B3; --on-navy: #FFFFFF;
    --ok: #6BD06B; --ok-bg: #173320; --bad: #FF8080; --bad-bg: #3B1B1E; --warn: #F2B04C; --warn-bg: #3A2C12; --info: #9CC4EC; --info-bg: #1B3147;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1620; --panel: #17222E; --panel2: #1F2D3B; --ink: #E7EEF5; --ink2: #9DB3C8; --line: #33475C;
  --navy: #2F6298; --navy2: #3A75B3; --on-navy: #FFFFFF;
  --ok: #6BD06B; --ok-bg: #173320; --bad: #FF8080; --bad-bg: #3B1B1E; --warn: #F2B04C; --warn-bg: #3A2C12; --info: #9CC4EC; --info-bg: #1B3147;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--navy2); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 2rem; } h2 { font-size: 1.35rem; text-transform: uppercase; letter-spacing: .04em; } h3 { font-size: 1.15rem; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-weight: 500; }
.muted { color: var(--ink2); }
.small { font-size: .88rem; }
.num { font-variant-numeric: tabular-nums; }

/* tool bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--navy); color: var(--on-navy); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; letter-spacing: .05em; text-transform: uppercase; margin-right: 4px; white-space: nowrap; }
.top button { background: transparent; border: 1.5px solid rgba(255,255,255,.55); color: var(--on-navy); border-radius: var(--r); min-height: 44px; padding: 4px 12px; font-weight: 600; }
.top button.on { background: var(--on-navy); color: #1B3A5C; }
.search { flex: 1 1 220px; min-width: 0; position: relative; }
.search input { width: 100%; min-height: 44px; border-radius: var(--r); border: 0; padding: 4px 12px; background: #FFFFFF; color: #13202D; }
.sync { font-size: .82rem; font-weight: 600; padding: 4px 8px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.55); white-space: nowrap; }
.sync.off { background: #FBEFD9; color: #6B3D00; border-color: #FBEFD9; }
#results { position: fixed; z-index: 30; left: 16px; right: 16px; max-width: 760px; margin: 0 auto; background: var(--panel); border: 2px solid var(--navy); border-radius: var(--r); max-height: 70vh; overflow: auto; box-shadow: 0 12px 30px rgba(0,0,0,.3); }
#results button { display: flex; flex-wrap: wrap; gap: 4px 12px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; min-height: 52px; align-items: baseline; }
#results .kind { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); min-width: 78px; font-weight: 600; }

.wrap { padding-inline: 16px; padding-block: 16px 96px; max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.banner { border: 2px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.banner.bad { border-color: var(--bad); background: var(--bad-bg); }
.banner.warn { border-color: var(--warn); background: var(--warn-bg); }
.banner.info { border-color: var(--info); background: var(--info-bg); }
.banner > div { flex: 1 1 260px; min-width: 0; }

.head { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: flex-end; justify-content: space-between; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.count { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 12px; min-width: 92px; }
.count b { display: block; font-family: var(--f-display); font-size: 1.7rem; line-height: 1; }
.count span { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); font-weight: 600; }

.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec > h2 { display: flex; gap: 8px; align-items: baseline; }
.sec > h2 .n { font-family: var(--f-mono); font-size: .95rem; color: var(--ink2); }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 12px 14px; color: var(--ink2); font-size: .95rem; }

/* job card */
.card { display: flex; gap: 12px; align-items: stretch; width: 100%; text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-left-width: 8px; border-radius: var(--r); padding: 10px 12px; min-height: 76px; }
.card.b-approval { border-left-color: var(--warn); } .card.b-hold { border-left-color: var(--bad); border-left-style: double; } .card.b-ready { border-left-color: var(--navy); }
.card.b-progress { border-left-color: var(--ok); } .card.b-move { border-left-color: var(--ink2); border-left-style: dashed; } .card.b-notready { border-left-color: var(--line); }
.pri { flex: 0 0 auto; width: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--f-display); font-weight: 700; font-size: 2rem; line-height: 1; border-right: 1px solid var(--line); padding-right: 10px; }
.pri small { font-size: .62rem; letter-spacing: .08em; color: var(--ink2); font-family: var(--f-body); font-weight: 600; }
.pri .rush { font-size: .68rem; background: var(--bad); color: #fff; padding: 1px 4px; border-radius: 3px; margin-top: 3px; font-family: var(--f-body); letter-spacing: .05em; }
.c-main { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.c-main .pn { font-size: 1.15rem; }
.c-main .nm { overflow-wrap: anywhere; }
.c-act { flex: 0 1 190px; min-width: 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; justify-content: center; text-align: right; }
.next { font-weight: 600; }
@media (max-width: 520px) { .card { flex-wrap: wrap; } .c-act { flex: 1 1 100%; align-items: flex-start; text-align: left; } }
.pill { display: inline-flex; gap: 6px; align-items: center; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 99px; border: 1.5px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-bg); } .pill.bad { color: var(--bad); background: var(--bad-bg); } .pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.info { color: var(--info); background: var(--info-bg); } .pill.plain { color: var(--ink2); }

/* buttons */
.btn { min-height: 56px; padding: 8px 18px; border-radius: var(--r); border: 2px solid var(--navy); background: var(--panel); color: var(--ink); font-weight: 600; font-size: 1.05rem; }
.btn.primary { background: var(--navy); color: var(--on-navy); font-family: var(--f-display); font-size: 1.5rem; letter-spacing: .03em; text-transform: uppercase; min-height: 68px; padding-inline: 28px; }
.btn.go { background: var(--ok); border-color: var(--ok); color: #fff; } .btn.stop { background: var(--bad); border-color: var(--bad); color: #fff; }
:root[data-theme="dark"] .btn.go, :root[data-theme="dark"] .btn.stop { color: #0E1620; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.go, :root:not([data-theme="light"]) .btn.stop { color: #0E1620; } }
.btn.sm { min-height: 44px; font-size: .95rem; padding: 4px 12px; }
.btn.sel { background: var(--navy); color: var(--on-navy); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tiles .btn { text-align: left; display: flex; flex-direction: column; justify-content: center; }
.tiles .btn small { font-weight: 400; opacity: .85; }

/* job screen */
.jobhead { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; }
.jobhead .t { flex: 1 1 320px; min-width: 0; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: .95rem; }
.facts b { font-family: var(--f-mono); font-weight: 500; }
.oprail { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.opchip { flex: 0 0 auto; min-width: 104px; min-height: 60px; text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: var(--r); padding: 6px 10px; display: flex; flex-direction: column; }
.opchip b { font-family: var(--f-mono); font-size: 1.05rem; } .opchip span { font-size: .74rem; color: var(--ink2); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.opchip.cur { border-color: var(--navy); border-width: 3px; } .opchip.s-done { background: var(--ok-bg); } .opchip.s-hold { background: var(--bad-bg); border-color: var(--bad); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 2px solid var(--navy); }
.tabs button { min-height: 48px; padding: 4px 16px; border: 0; background: none; font-family: var(--f-display); font-size: 1.2rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ink2); border-radius: var(--r) var(--r) 0 0; white-space: nowrap; }
.tabs button.on { background: var(--navy); color: var(--on-navy); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.instr { font-size: 1.3rem; line-height: 1.45; font-weight: 500; max-width: 68ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-mono); font-size: .9rem; border: 1.5px solid var(--ink2); border-radius: 4px; padding: 2px 8px; }
.cp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 640px) { .cp { grid-template-columns: minmax(0, 1fr); } }
.cpbox { border: 2px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cpbox h3 { text-transform: uppercase; letter-spacing: .05em; }
.cpbox.pass { border-color: var(--ok); background: var(--ok-bg); } .cpbox.wait { border-color: var(--warn); background: var(--warn-bg); border-style: dashed; } .cpbox.fail { border-color: var(--bad); background: var(--bad-bg); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.kv div { background: var(--panel2); border-radius: var(--r); padding: 6px 10px; } .kv b { display: block; font-family: var(--f-display); font-size: 1.5rem; line-height: 1.1; } .kv span { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); font-weight: 600; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); white-space: nowrap; }
.actionbar { position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--panel); border: 2px solid var(--navy); border-radius: var(--r); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; box-shadow: 0 -6px 18px rgba(0,0,0,.12); }
.actionbar .msg { flex: 1 1 220px; min-width: 0; font-weight: 500; }
.viewer { border: 1px solid var(--line); background: #FFFFFF; border-radius: var(--r); overflow: auto; max-height: 72vh; }
.viewer img { display: block; max-width: none; }
.doclist { display: flex; flex-direction: column; gap: 6px; }
.doclist .btn { text-align: left; }
.flagnote { color: var(--warn); font-weight: 600; }
ul.clean { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
details { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
details > summary { padding: 12px 14px; cursor: pointer; font-weight: 600; min-height: 48px; }
details > .in { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.issue { border-left: 6px solid var(--warn); padding: 6px 12px; background: var(--panel2); border-radius: 0 var(--r) var(--r) 0; }
.issue.high { border-left-color: var(--bad); } .issue.low { border-left-color: var(--ink2); }

/* modal */
#modal { position: fixed; inset: 0; z-index: 40; background: rgba(10,18,28,.62); display: flex; align-items: flex-start; justify-content: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); overflow: auto; }
.sheet { background: var(--panel); border-radius: 10px; border: 2px solid var(--navy); width: 100%; max-width: 720px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.sheet.wide { max-width: 1100px; }
.sheet label, .panel label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: .95rem; }
.sheet input, .sheet select, .sheet textarea, .field { min-height: 52px; border: 2px solid var(--line); border-radius: var(--r); padding: 6px 12px; background: var(--panel); font-size: 1.15rem; width: 100%; }
.sheet textarea { min-height: 84px; }
.sheet input[type=checkbox] { width: 28px; min-height: 28px; height: 28px; flex: 0 0 auto; }
.check { flex-direction: row !important; align-items: center; gap: 12px !important; min-height: 48px; font-weight: 500 !important; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 8px; justify-content: center; }
.pad button { height: 64px; font-family: var(--f-display); font-size: 1.7rem; font-weight: 700; border: 2px solid var(--line); background: var(--panel2); border-radius: var(--r); }
.dots { text-align: center; font-size: 2rem; letter-spacing: .4em; min-height: 44px; font-family: var(--f-mono); }
.recon { font-weight: 600; padding: 8px 12px; border-radius: var(--r); background: var(--panel2); }
.recon.bad { background: var(--bad-bg); color: var(--bad); } .recon.ok { background: var(--ok-bg); color: var(--ok); }
#toast { position: fixed; z-index: 50; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; }
#toast div { background: #13202D; color: #fff; border-radius: var(--r); padding: 12px 18px; font-weight: 600; max-width: 640px; border: 2px solid #fff; }
#toast div.bad { background: #8F0000; }
.answer { white-space: pre-wrap; background: var(--panel2); border-radius: var(--r); padding: 12px 14px; max-width: 70ch; }
.qr { background: #fff; padding: 8px; border-radius: 4px; display: inline-block; line-height: 0; }
.label { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; border: 2px dashed var(--line); border-radius: var(--r); padding: 12px; }
@media (prefers-reduced-motion: no-preference) { .card, .btn { transition: transform .06s; } .card:active, .btn:active { transform: scale(.985); } }

/* master list rows */
.trow { padding: 0; min-height: 0; align-items: stretch; }
.trow.kid { margin-left: 28px; width: calc(100% - 28px); }
.tmain { flex: 1 1 0; min-width: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; text-align: left; background: none; border: 0; padding: 10px 12px; min-height: 68px; }
.tcol { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tdate { flex: 0 0 104px; } .tdate b { font-family: var(--f-display); font-size: 1.35rem; line-height: 1; } .tdate small { font-size: .72rem; color: var(--ink2); font-weight: 600; letter-spacing: .04em; overflow-wrap: anywhere; }
.tpart { flex: 1 1 240px; } .tpart .pn { font-size: 1.15rem; }
.tstat { flex: 0 1 190px; align-items: flex-end; text-align: right; }
.trow > .btn.sm { align-self: center; margin-right: 8px; }
@media (max-width: 560px) { .tstat { flex: 1 1 100%; align-items: flex-start; text-align: left; } .trow.kid { margin-left: 14px; width: calc(100% - 14px); } }

.ghead { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; border-bottom: 2px solid var(--navy); padding-bottom: 4px; margin-top: 8px; }
.ghead h2 { font-size: 1.5rem; }

.zoomer { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.zoomer span { font-size: .8rem; font-weight: 600; min-width: 40px; text-align: center; }
.zoomer button { min-width: 44px; padding: 4px 8px; }

.top .brandbtn { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .04em; text-transform: uppercase; background: var(--on-navy); color: #1B3A5C; border-color: var(--on-navy); }
.menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.mtile { min-height: 132px; text-align: left; background: var(--panel); border: 2px solid var(--navy); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; justify-content: flex-end; position: relative; }
.mtile .mt-n { position: absolute; top: 10px; right: 14px; font-family: var(--f-display); font-weight: 700; font-size: 2.4rem; line-height: 1; }
.mtile .mt-t { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; text-transform: uppercase; letter-spacing: .03em; line-height: 1.05; }
.mtile .mt-s { color: var(--ink2); font-size: .95rem; }
.mtile.go { background: var(--navy); color: var(--on-navy); } .mtile.go .mt-s { color: var(--on-navy); opacity: .85; }
.mtile.warn { border-color: var(--warn); background: var(--warn-bg); } .mtile.bad { border-color: var(--bad); background: var(--bad-bg); }

.lblgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

.cp.cp2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 640px) { .cp.cp2 { grid-template-columns: minmax(0, 1fr); } }

/* audit: one-line tool bar, due badges, tile count clear of the title */
.top { flex-wrap: nowrap; gap: 6px; padding: 8px 10px; } .top button { white-space: nowrap; padding: 4px 10px; } #b-manage { display: none; }
.search { flex: 1 1 120px; } .zoomer span { display: none; } .zoomer button { min-width: 40px; }
@media (max-width: 900px) { .sync { display: none; } } @media (max-width: 700px) { .top { flex-wrap: wrap; } }
.mtile { padding-top: 56px; }
.due { align-self: flex-start; margin-top: 4px; font-size: .85rem; font-weight: 600; color: var(--ink2); }
.due.week { color: var(--ink); } .due.none { font-weight: 500; }
.due.soon, .due.late { padding: 2px 8px; border-radius: 4px; font-weight: 700; letter-spacing: .04em; }
.due.soon { background: var(--warn-bg); color: var(--warn); border: 1.5px solid var(--warn); }
.due.late { background: var(--bad); color: #fff; }

@media (max-width: 1100px) { .cols { grid-template-columns: minmax(0, 1fr); } .sync { display: none; } }
.col + .col .card { flex-wrap: wrap; } .col + .col .c-main { flex: 1 1 180px; }
.col + .col .c-act { flex: 1 1 100%; flex-direction: row; align-items: center; justify-content: space-between; text-align: left; }
@media (max-height: 700px) { .mtile { min-height: 112px; padding-top: 44px; } }

.pri.pd { font-size: 1.25rem; }

/* Improve charts: categorical slots from the validated reference palette */
:root { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; } }
:root[data-theme="dark"] { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; }
.chart { width: 100%; overflow-x: auto; } .chart svg { width: 100%; min-width: 460px; height: auto; display: block; }
.chart .ax { font-size: 13px; fill: var(--ink2); } .chart .val { font-size: 13px; fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .9rem; color: var(--ink2); } .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
td.num { font-variant-numeric: tabular-nums; text-align: right; }

/* toast sits under the tool bar so it never covers the action buttons */
#toast { top: calc(70px + env(safe-area-inset-top, 0px)); bottom: auto; }
/* narrow screens (tablet portrait, phones): search gets its own full row */
@media (max-width: 1000px) {
  .top { flex-wrap: wrap; }
  .top .search { order: 9; flex: 1 1 100%; }
  .top .zoomer button { min-width: 36px; padding: 4px 6px; }
  #toast { top: calc(120px + env(safe-area-inset-top, 0px)); }
}

.trainvid { width: 100%; max-height: 70vh; background: #000; border-radius: var(--r); }
.tabs-role { flex-wrap: wrap; gap: 8px; }
.tsteps { margin: 0; padding-left: 1.6em; display: flex; flex-direction: column; gap: 12px; font-size: 1.1rem; }
.tsteps li b { display: block; font-size: 1.15rem; } .tsteps li span { color: var(--ink2); }

/* Risk colors, same as the paper travelers */
.risk { display: inline-block; width: 22px; height: 22px; border: 1px solid #333; border-radius: 3px; vertical-align: middle; }
.risk.big { width: auto; height: auto; padding: 3px 10px; font: 700 .85rem/1.2 Barlow, Arial, sans-serif; color: #000; text-transform: uppercase; letter-spacing: .04em; }
.risk.rL { background: #92D050; } .risk.rM { background: #FFFF00; } .risk.rH { background: #FF0000; color: #fff; }
.opchip.rk-L { border-top: 6px solid #92D050; } .opchip.rk-M { border-top: 6px solid #FFFF00; } .opchip.rk-H { border-top: 6px solid #FF0000; }

/* audit 2026-10-18: nothing on a shop tablet below ~13.5px; long Spanish words wrap inside tiles */
.small { font-size: .92rem; }
th { font-size: .82rem; }
.count span, .kv span { font-size: .82rem; }
.opchip span { font-size: .8rem; }
.pill { font-size: .82rem; }

.tdate small { font-size: .8rem; }

#results .kind { font-size: .82rem; }

.zoomer span { font-size: .85rem; }
.mtile .mt-t { overflow-wrap: normal; overflow: hidden; }
.opchip span, .tdate small, .pri small { font-size: .85rem; }
button small, .tiles small { font-size: .85rem; }
#b-zout, #b-zin { min-width: 44px; }
.pl-done .pn, .pl-done .c-main > .small.muted { text-decoration: line-through; opacity: .7; }
.plfloor { border: 2px solid var(--line); border-radius: var(--r); padding: 10px 12px; background: var(--panel2); }
.plfloor summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.plfloor .card { margin-top: 8px; }
.floorat { color: var(--navy); }
/* priorities: next-up, assigned, board, TV */
.card.pl-next { border-width: 3px; border-color: var(--ok); box-shadow: 0 0 0 2px rgba(0,102,0,.12); }
.card.pl-mine { background: #EEF7EE; }
.plwho { color: var(--navy); }
.ptop .ptgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.ptcell { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--panel); border: 2px solid var(--ok); border-radius: var(--r); padding: 10px 12px; min-height: 64px; }
.ptcell small { font-size: .82rem; color: var(--ink2); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.bcol { background: var(--panel); border: 2px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.bhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; border-bottom: 3px solid var(--navy); padding-bottom: 6px; }
.bhead h2 { margin: 0; }
.bitem { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border-radius: var(--r); background: var(--panel2); }
.bitem.next { background: #E6F2E6; border: 2px solid var(--ok); }
.bitem .bn { font-size: 1.6rem; min-width: 30px; text-align: center; color: var(--navy); line-height: 1.1; }
.bitem.next .bn { color: var(--ok); }
.bt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bt .mono { font-weight: 700; overflow-wrap: anywhere; }
.bdone { color: var(--ok); font-weight: 700; }
.tvclock { font-size: 1.6rem; font-weight: 700; color: var(--navy); }
body.tv .top, body.tv #toast, body.tv #results { display: none !important; }
body.tv .wrap { max-width: none; padding: 14px 18px; }
body.tv .head h1 { font-size: 2.4rem; }
body.tv .bhead h2 { font-size: 1.7rem; }
body.tv .bitem { font-size: 1.25rem; }
body.tv .bitem .small { font-size: 1.05rem; }
body.tv .bitem .bn { font-size: 2.2rem; min-width: 44px; }
body.tv .tvclock { font-size: 2.4rem; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
body.tv .board { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }

.pinpop { position: fixed; inset: 0; z-index: 60; background: rgba(10,18,28,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.pinbox { background: var(--panel); border-radius: calc(var(--r) * 1.5); padding: 18px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
.pinbox .pad { grid-template-columns: repeat(3, 1fr); }
.pinbox .pad button { height: 70px; }
td.bad { color: var(--bad); font-weight: 700; }

  /* ---------- search ---------- */
  /* Spoken numbers: "one million ten 50" -> 1001050, "forty dash ten twenty two" -> 40-1022 */
  const NUM_U = { zero: 0, oh: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19 };
  const NUM_T = { twenty: 20, thirty: 30, forty: 40, fourty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90 };
  const normKey = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
  function stripAsk(raw) { const s = String(raw).toLowerCase().replace(/#/g, ' ').replace(/\b(find|search|show|open|get|give|pull|look|up|me|the|a|an|for|is|where|shop|sales|work|order|orders|traveler|travelers|traveller|travellers|travel|travels|traveling|travelling|shoveler|ticket|number|numbers|num|no|job|jobs|part|please)\b/g, ' ').replace(/(^|\s)(buscar|busca|busque|encontrar|encuentra|abrir|abre|mostrar|muestra|ver|el|la|los|las|de|del|un|una|número|numero|núm|orden|órdenes|ordenes|taller|viajero|viajeros|hoja|parte|partes|trabajo|por|favor|dónde|donde|está|esta|cuál|cual)(?=\s|$)/g, ' ').replace(/\s+/g, ' ').trim(); return s || String(raw).trim(); }
  function spokenCands(raw) {
    const words = raw.toLowerCase().replace(/(\d),(?=\d{3})/g, '$1').replace(/\b(dash|hyphen|minus)\b/g, ' - ').replace(/-/g, ' - ').split(/[\s,.]+/).filter(Boolean);
    const ch = []; let tens = false, used = false, other = 0;
    words.forEach((w) => {
      if (w === '-') { ch.push('-'); tens = false; }
      else if (/^\d+$/.test(w)) { if (tens && w.length === 1 && w !== '0') ch[ch.length - 1] = String(Number(ch[ch.length - 1]) + Number(w)); else ch.push(w); tens = false; }
      else if (w in NUM_U) { used = true; if (tens && NUM_U[w] > 0 && NUM_U[w] < 10) ch[ch.length - 1] = String(Number(ch[ch.length - 1]) + NUM_U[w]); else ch.push(String(NUM_U[w])); tens = false; }
      else if (w in NUM_T) { used = true; ch.push(String(NUM_T[w])); tens = true; }
      else if (w === 'hundred' || w === 'thousand' || w === 'million') { used = true; const m = { hundred: 100, thousand: 1000, million: 1000000 }[w]; if (ch.length && ch[ch.length - 1] !== '-') ch[ch.length - 1] = String(Number(ch[ch.length - 1]) * m); else ch.push(String(m)); tens = false; }
      else if (w !== 'and' && w !== 'number' && w !== 'part' && w !== 'traveler') other++;
    });
    const nums = ch.filter((x) => x !== '-');
    if (other || nums.length < 1 || (!used && nums.length < 2)) return [];
    const out = [ch.join('')];
    for (let i = 0; i < ch.length - 1; i++) { const z = (ch[i].match(/0+$/) || [''])[0].length, rest = ch.slice(i + 1).filter((x) => x !== '-').join(''); if (z >= 2 && rest && rest.length <= z) out.push(ch.slice(0, i).join('') + String(Number(ch[i]) + Number(rest))); }
    if (ch.indexOf('-') < 0) out.push(String(nums.reduce((a, b) => a + Number(b), 0)));
    return out.filter((x, i, a) => x && a.indexOf(x) === i);
  }
  function spoken(raw) {
    const cands = spokenCands(raw); if (!cands.length) return '';
    const keys = {}; jobs().forEach((j) => { keys[normKey(j.pn)] = 1; keys[normKey(j.so)] = 1; }); ['metal', 'filter'].forEach((f) => (store.logs[f] || []).forEach((r) => { keys[normKey(r.pn)] = 1; keys[r.t] = 1; })); W.ROUTINGS.forEach((r) => { keys[normKey(r.pn)] = 1; });
    const all = Object.keys(keys);
    for (const c of cands) { if (keys[normKey(c)]) return c; }
    for (const c of cands) { const k = normKey(c); if (k.length >= 4 && all.some((x) => x.indexOf(k) >= 0)) return c; }
    return cands[0];
  }
  function search(q, orig) {
    const el = $('#results'); q = q.trim().toLowerCase(); if (!q) { el.hidden = true; return; }
    const asked = orig || q; q = stripAsk(q).toLowerCase();
    const heard = spoken(q), said = asked; if (heard && heard !== q) q = heard.toLowerCase();
    const nq = normKey(q), loose = nq.length >= 4 && /\d/.test(nq);
    const out = [], has = (s) => { const x = String(s).toLowerCase(); return x.indexOf(q) >= 0 || (loose && x.replace(/[^a-z0-9]/g, '').indexOf(nq) >= 0); };
    if (q !== said) out.push('<button data-noop><span class="kind">Heard</span><span>“' + esc(said) + '”</span><b class="mono">→ ' + esc(q.toUpperCase()) + '</b></button>');
    jobs().forEach((j) => { if (has(j.so) || has(j.id) || has(j.pn) || has(j.name)) out.push('<button data-open="' + esc(j.id) + '"><span class="kind">Job</span><b>Shop Order ' + esc(j.so) + '</b><span class="mono">' + esc(j.pn) + '</span><span class="small muted">' + esc(W.where(j)) + '</span></button>'); });
    let pc = 0; paper().forEach((x) => { if (pc < 8 && (x.r.t === q || has(x.r.pn) || has(x.r.d))) { pc++; out.push('<button data-paper="' + esc(x.r.t) + '" data-floor="' + x.f + '"><span class="kind">' + (x.r.s === 'O' ? 'Open' : 'Closed') + '</span><b>#' + esc(x.r.t) + '</b><span class="mono">' + esc(x.r.pn) + '</span><span class="small muted">' + esc(x.r.d) + ' · qty ' + (x.r.q == null ? '—' : x.r.q) + ' · ' + x.f + ' floor</span></button>'); } });
    W.STATIONS.forEach((s) => { if (s.kind === 'work' && (has(s.name) || has(s.note))) out.push('<button data-station="' + s.id + '"><span class="kind">Area</span><b>' + esc(s.name) + '</b><span class="small muted">' + esc(s.note) + '</span></button>'); });
    let mc = 0; W.ROUTINGS.forEach((r) => { if (r.master && mc < 6 && (has(r.pn) || has(r.name))) { mc++; out.push('<button data-master="' + esc(r.id) + '"><span class="kind">Master</span><span class="mono">' + esc(r.pn) + '</span><span>' + esc(r.name) + '</span><span class="small muted">' + esc(r.kind) + ' · ' + r.ops.length + ' ops</span></button>'); } });
    BASE.forEach((r) => {
      if (has(r.pn) || has(r.name)) out.push('<button data-nav="manage" data-mtab="routings"><span class="kind">Part</span><span class="mono">' + esc(r.pn) + '</span><span>' + esc(r.name) + '</span></button>');
      r.docs.forEach((d, k) => { if (has(d.t)) out.push('<button data-libdoc="' + r.id + '" data-k="' + k + '"><span class="kind">Drawing</span><b>' + esc(d.t) + '</b><span class="small muted">' + (d.rev ? 'Rev ' + esc(d.rev) + ' · ' : '') + 'on ' + esc(r.pn) + (d.flag ? ' · CHECK REV' : '') + '</span></button>'); });
      r.ops.forEach((o) => { if (has(o.text) || o.mach.some(has)) out.push('<button data-nav="manage" data-mtab="routings"><span class="kind">Instruction</span><span class="mono">' + esc(r.pn) + ' op ' + o.n + '</span><span class="small muted">' + esc(o.text.slice(0, 90)) + '…</span></button>'); });
    });
    if (!orig && out.length - (q !== said ? 1 : 0) === 0) { const nums = q.split(/\s+/).filter((w) => /\d/.test(w)).join(' '); if (nums && nums !== q) return search(nums, asked); }
    out.splice(22);
    out.push('<button data-m="ask" data-q0="' + esc($('#q').value) + '"><span class="kind">Helper</span><b>Ask: “' + esc($('#q').value) + '”</b><span class="small muted">answers from the shop record</span></button>');
    el.innerHTML = out.join(''); el.hidden = false; trDom(el); el.style.top = ($('.top').getBoundingClientRect().bottom + 4) + 'px';
  }

        { const np = { id: n.toLowerCase().replace(/[^a-z0-9]/g, '') + Date.now().toString(36).slice(-3), name: n, area: $('#pp-area').value, role: rv.split(':')[0], side: rv.split(':')[1] || '', pin: '' }; store.cfg.roster.push(np); saveCfg((c) => { if (!c.roster.some((y) => y.id === np.id)) c.roster.push(W.clone(np)); }); } return toast(n + ' added'); }
      if (SRV() && (d.a === 'resetPin' || d.a === 'rmPerson' || d.a === 'finFlag')) { const x = person(d.id); if (!x || ui.user.role !== 'manager') return; if (!ui.finTok) return openModal({ type: 'finpin', who: ui.user.id, pin: '' });
        const call = d.a === 'resetPin' ? rpc('pin_reset', { p_token: ui.finTok, p_id: x.id }) : d.a === 'rmPerson' ? rpc('staff_remove', { p_token: ui.finTok, p_id: x.id }) : rpc('staff_save', { p_token: ui.finTok, p: { id: x.id, name: x.name, area: x.area, role: x.role, side: x.side || '', fin: !x.fin } });
        call.then(() => { loadStaff(); toast(d.a === 'resetPin' ? x.name + ' will create a new PIN at next sign-in' : d.a === 'rmPerson' ? x.name + ' removed' : x.name + (x.fin ? ' can no longer see prices or costs' : ' can now see prices and costs')); }).catch(() => { toast('Not saved. Enter your PIN again.', 'bad'); ui.finTok = null; ui.fin = null; render(); }); return; }
      if (d.a === 'resetPin') { const x = person(d.id); if (x && ui.user.role === 'manager') { x.pin = ''; { const pid = x.id; saveCfg((c) => { const y = c.roster.find((z) => z.id === pid); if (y) y.pin = ''; }); } toast(x.name + ' will create a new PIN at next sign-in'); } return; }
      if (d.a === 'rmPerson') { { const pid = d.id; store.cfg.roster = store.cfg.roster.filter((p) => p.id !== pid); return saveCfg((c) => { c.roster = c.roster.filter((p) => p.id !== pid); }); } }
      if (d.a === 'saveRules') { store.cfg.rules = { idleLock: Math.max(30, Number($('#ru-idle').value) || 180), selfApprove: $('#ru-self').checked }; { const rl = W.clone(store.cfg.rules); saveCfg((c) => { c.rules = Object.assign({}, c.rules, rl); }); } return toast('Rules saved'); }
      if (d.a === 'deliver') return void run(d.job, 'deliver', { lot: d.lot });
      if (d.a === 'unblock') return void run(d.job, 'unblock', {});
      return void run(d.job, d.a, { i: Number(d.i) });
    }
  });
  document.addEventListener('change', (e) => { const t = e.target; if (t && t.id === 'fin-file' && t.files && t.files[0]) { uploadFinalLog(t.files[0]); t.value = ''; } });
  document.addEventListener('input', (e) => {
    ui.touched = Date.now(); const t = e.target, m = ui.modal;
    if (t.id === 'q') return search(t.value);
    if (t.id === 'lib-q') { ui.libQ = t.value; const hb = $('#lib-hits'); if (hb) { hb.innerHTML = libHits(t.value); trDom(hb); } return; }

    if (!m) return;
    if (t.dataset.f) { m[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value; if (m.type === 'finish' && (t.dataset.f === 'good' || t.dataset.f === 'scrap')) { const id = t.id, pos = t.value.length; renderModal(); const n = document.getElementById(id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { /* number inputs */ } } } }
    if (t.dataset.chk) m.chk[t.dataset.chk] = t.checked;

  document.addEventListener('keydown', (e) => {
    ui.touched = Date.now();

      const dg = /^[0-9]$/.test(e.key) ? e.key : NP[e.code], m = ui.modal;
      const k = dg || (e.key === 'Backspace' ? 'del' : e.key === 'Delete' ? 'clr' : '');
      if (k) { e.preventDefault(); pinKey(m, k); return; }

    }

    if (e.key === 'Enter' && e.target.id === 'q') { const q00 = stripAsk(e.target.value.trim()).toLowerCase(), q0 = jobs().some((x) => x.so.toLowerCase() === q00) || !/\d/.test(q00) || /-c\d+$/.test(q00) ? q00 : (q00.split(/\s+/).filter((w) => /\d/.test(w)).join(' ') || q00), q = (/-c\d+$/.test(q0) ? q0 : (spoken(q0) || q0)).toLowerCase(), bx = q.match(/^(.+)-c(\d+)$/);
      if (bx) { const j = jobs().find((x) => x.so.toLowerCase() === bx[1]), l = j && j.lots.find((x) => x.id.toLowerCase() === 'c' + bx[2]);
        if (l) { e.target.value = ''; $('#results').hidden = true; if (l.st !== 'received') { if (need()) openModal({ type: 'receive', job: j.id, lot: l.id, count: l.qty }); } else { openJob(j.id, l.from); ui.tab = 'record'; render(); toast('Box ' + j.so + '-' + l.id + ': ' + l.qty + ' pcs, received at ' + W.station(l.to).name); } return; } }
      const j = jobs().find((x) => x.id.toLowerCase() === q || x.so.toLowerCase() === q); if (j) openJob(j.id); }
    if (e.key === 'Enter' && ui.modal && e.target.tagName === 'INPUT') { e.preventDefault(); submit(); }
  });
  window.addEventListener('online', () => { store.offline = false; Object.keys(store.queue).forEach(pump); renderSync(); });
  window.addEventListener('offline', renderSync);
  setInterval(() => {
    if (ui.user && !ui.modal && Date.now() - ui.touched > store.cfg.rules.idleLock * 1000) { signOutUser(); render(); toast('Signed out after ' + store.cfg.rules.idleLock + ' s idle'); return; }
    const a = document.activeElement; if (!ui.modal && !(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))) render();
  }, 30000);

  ui.scale = 100; setZoom(Number(ls.get('wt-zoom')) || 100);
  const hs = (location.hash || '').slice(1), saved = ls.get('wt-station');
  const okSt = (x) => !!x && (/^all(metal|filter)?$/.test(x) || W.STATIONS.some((s) => s.id === x && s.kind === 'work'));
  ui.station = okSt(hs) ? hs : okSt(saved) ? saved : 'all';
  ui.view = 'home';
  if (hs === 'tv') { ui.tv = true; ui.view = 'board'; document.body.classList.add('tv'); }
  init(); loadMaster();
