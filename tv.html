<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walker Priorities TV</title>
<meta name="robots" content="noindex">
<style>
:root{--navy:#1B3A5C;--ok:#1E7B34;--bg:#E7EAF0;--panel:#fff;--line:#C9D0DA;--muted:#5A6676;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:#13202F;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
.tva{height:100vh;display:flex;flex-direction:column;padding:2vh 2.2vw;gap:1.2vh}
.h{display:flex;justify-content:space-between;align-items:center;border-bottom:.5vh solid var(--navy);padding-bottom:.8vh}
.h h1{margin:0;font-size:5vh;color:var(--navy);letter-spacing:.02em}
.meta{font-size:1.9vh;color:var(--muted);text-align:right}.clk{font-size:4.4vh;font-weight:700;color:var(--navy)}
.l{flex:1;display:flex;flex-direction:column;gap:.9vh;min-height:0}
.r{display:grid;grid-template-columns:6vw 1fr auto;align-items:center;gap:1.2vw;background:var(--panel);border:.25vh solid var(--line);border-radius:1vh;padding:0 1.4vw;flex:1 1 0;min-height:0;max-height:15vh;overflow:hidden}
.r.next{background:#E6F2E6;border:.5vh solid var(--ok)}
.n{font-size:var(--tvn);font-weight:800;color:var(--navy);text-align:center}.r.next .n{color:var(--ok)}
.t{font-size:var(--tvt);font-weight:700;line-height:1.15;font-family:var(--mono);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.s{font-size:var(--tvs);color:var(--muted);margin-top:.3vh}.w{font-size:var(--tvs);font-weight:700;text-align:right;white-space:nowrap}
.tag{display:inline-block;background:var(--ok);color:#fff;border-radius:.6vh;padding:.2vh .7vw;font-size:calc(var(--tvs)*.9);margin-right:.6vw;vertical-align:middle;font-family:system-ui,sans-serif}
.f{display:flex;justify-content:space-between;align-items:center;font-size:1.8vh;color:var(--muted)}
.f button{font:inherit;font-size:1.6vh;padding:.5vh 1vw;opacity:.5;background:#fff;border:1px solid var(--line);border-radius:.6vh;cursor:pointer}
.e{flex:1;display:flex;align-items:center;justify-content:center;font-size:4vh;color:var(--muted);text-align:center}
.pick{padding:4vh 4vw}.pick h1{font-size:4.5vh;color:var(--navy);margin:0 0 1vh}.pick p{font-size:2.2vh;color:var(--muted);margin:0 0 3vh}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(22vw,1fr));gap:1.6vh 1.2vw}
.grid button{font:inherit;font-size:3vh;font-weight:700;color:var(--navy);background:#fff;border:.3vh solid var(--navy);border-radius:1.2vh;padding:3vh 1vw;cursor:pointer;text-align:left}
.grid small{display:block;font-size:1.8vh;color:var(--muted);font-weight:400;margin-top:.5vh}
.warn{color:#9a5b00}
</style></head><body><div id="app"></div>
<script>
(function () {
  const URL_ = 'https://ztpkhjgsxzlwxjzddgzf.supabase.co', API = 'sb_publishable_Zq17n4I5OapehYOckC7JQA_H7shyW9S';
  const AREAS = [['metal','Metal Floor'],['wash','Wash'],['machine','Machine Shop'],['cnc','CNC'],['weld','Welding'],['wire','Wire welding'],['glue','Glue / Assembly'],['powder','Paint / Powder Coat'],['pack','Packing and Assembly'],['pleat','Pleating'],['pot','Potting line 1'],['clip','Clipping'],['race','Racing'],['qc','QC and Packaging']];
  const ls = { get: (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
  const q = new URLSearchParams(location.search);
  if (q.get('k')) ls.set('wt-tvkey', q.get('k'));
  if (q.get('area')) ls.set('wt-tvlane', q.get('area'));
  if (q.get('k') || q.get('area')) history.replaceState(null, '', location.pathname);
  const key = ls.get('wt-tvkey'); let lane = ls.get('wt-tvlane'), data = null, err = '', picking = !lane || !AREAS.some((a) => a[0] === lane);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const name = (id) => (AREAS.find((a) => a[0] === id) || [id, id])[1];
  const clock = () => new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  const app = document.getElementById('app');
  function draw() {
    if (!key) { app.innerHTML = '<div class="pick"><h1>Walker Priorities TV</h1><p>This TV needs its TV link once. Ask the office for the TV link and open it on this TV — no sign-in needed after that.</p></div>'; return; }
    if (picking) {
      app.innerHTML = '<div class="pick"><h1>Which area is this TV in?</h1><p>Tap the area. This TV will show only that area\'s priorities, all day. No sign-in.</p><div class="grid">' +
        AREAS.map((a) => '<button data-v="' + a[0] + '">' + esc(a[1]) + '<small>Show ' + esc(a[1]) + ' priorities</small></button>').join('') + '</div></div>';
      return;
    }
    const it = (data && data.items) || [], open = it.filter((x) => !x.done), done = it.filter((x) => x.done), N = Math.min(open.length, 8), rowH = 76 / Math.max(N, 5);
    const sz = '--tvn:' + (rowH * 0.42).toFixed(2) + 'vh;--tvt:' + Math.min(rowH * 0.27, 4.2).toFixed(2) + 'vh;--tvs:' + Math.min(rowH * 0.19, 2.6).toFixed(2) + 'vh';
    const today = new Date().toDateString(), stale = data && data.at && new Date(Number(data.at)).toDateString() !== today && open.length;
    const set = data && data.at ? 'Set ' + new Date(Number(data.at)).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + (data.by ? ' · ' + esc(data.by) : '') : '';
    app.innerHTML = '<div class="tva" style="' + sz + '"><div class="h"><h1>' + esc(name(lane).toUpperCase()) + ' — PRIORITIES</h1><div class="meta"><div class="clk">' + clock() + '</div>' + (stale ? '<span class="warn">⚠ not updated today</span>' : set) + (err ? '<div class="warn">' + esc(err) + '</div>' : '') + '</div></div>' +
      (!data ? '<div class="e">Loading…</div>' : open.length ? '<div class="l">' + open.slice(0, 8).map((x, k) => '<div class="r' + (k ? '' : ' next') + '"><div class="n">' + (k + 1) + '</div><div><div class="t">' + (k ? '' : '<span class="tag">NOW</span>') + esc(x.title) + '</div>' + (x.sub || x.note ? '<div class="s">' + esc(x.sub || '') + (x.note ? ' · Note: ' + esc(x.note) : '') + '</div>' : '') + '</div><div class="w">' + (x.who ? '👤 ' + esc(x.who) : '') + '</div></div>').join('') + '</div>'
        : '<div class="e">No priorities set for ' + esc(name(lane)) + ' yet.<br>Ask your supervisor.</div>') +
      '<div class="f"><span>' + [open.length > 8 ? '+ ' + (open.length - 8) + ' more after these' : '', done.length ? '✓ ' + done.length + ' done today' : ''].filter(Boolean).join(' · ') + '</span><span><button data-a="full">Full screen</button> <button data-a="pick">TV area: ' + esc(name(lane)) + '</button></span></div></div>';
  }
  async function load() {
    if (!key || picking) return draw();
    try {
      const r = await fetch(URL_ + '/rest/v1/rpc/tv_board', { method: 'POST', headers: { apikey: API, Authorization: 'Bearer ' + API, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_key: key, p_lane: lane }) });
      if (!r.ok) throw new Error(r.status === 400 || r.status === 401 || r.status === 403 ? 'TV link not valid — ask the office for the TV link' : 'Reconnecting…');
      data = await r.json(); err = '';
    } catch (e) { err = (e && e.message) || 'Reconnecting…'; }
    draw();
  }
  app.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.v) { lane = b.dataset.v; ls.set('wt-tvlane', lane); picking = false; data = null; load(); full(); return; }
    if (b.dataset.a === 'pick') { picking = true; draw(); }
    if (b.dataset.a === 'full') full();
  });
  function full() { try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} }
  const wl = () => { try { if (navigator.wakeLock && document.visibilityState === 'visible') navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} };
  wl(); document.addEventListener('visibilitychange', () => { wl(); if (document.visibilityState === 'visible') load(); });
  load(); setInterval(load, 30000);
  const t0 = Date.now(); setInterval(() => { if (Date.now() - t0 > 3600000 && navigator.onLine !== false) location.reload(); }, 60000);
})();
</script></body></html>
